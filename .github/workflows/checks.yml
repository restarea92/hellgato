name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact release PR head to validate
        required: true
        type: string
      base_sha:
        description: Exact main base for the full PR diff
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind dispatch to the reviewed head
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo 'Release PR moved after dispatch; refusing stale checks' >&2
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Install locked tools
        run: |
          pnpm install --frozen-lockfile
          npm install --global npm@11.9.0 --ignore-scripts
          # Windows global npm installs outside setup-node's first PATH entry.
          npm prefix --global >> "$GITHUB_PATH"
      - name: Release metadata and full-diff impact
        env:
          IMPACT_BASE: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          pnpm run release:metadata:check
          node scripts/check-release-impact.mjs --base "$IMPACT_BASE"
      - name: Prepare CORA and run JavaScript checks
        run: |
          node --input-type=module -e "import { assertNpmVersion } from './scripts/npm-release.mjs'; assertNpmVersion();"
          pnpm run prepare:cora
          pnpm test
          pnpm run build:npm
          node scripts/pack-npm.mjs --destination dist/npm
          node scripts/verify-npm.mjs --artifacts dist/npm
      - name: Prepare Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -r installer/requirements-build.txt
          if ($LASTEXITCODE) { throw 'Dependency installation failed' }
          python scripts/prepare-windows.py
          if ($LASTEXITCODE) { throw 'Runtime preparation failed' }
      - name: Python and installer migration checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s test -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Python checks failed' }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/test_installer_migration.ps1
          if ($LASTEXITCODE) { throw 'Installer migration checks failed' }
