name: Checks
on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact release PR head to validate
        required: true
        type: string
      base_sha:
        description: Exact main base for the full PR diff
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind dispatch to the reviewed head
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo 'Release PR moved after dispatch; refusing stale checks' >&2
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (Node 24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Install locked tools
        run: |
          pnpm install --frozen-lockfile
          npm install --global npm@11.9.0 --ignore-scripts
          # Windows global npm installs outside setup-node's first PATH entry.
          npm prefix --global >> "$GITHUB_PATH"
      - name: Select read-only source or reviewed release build context
        id: release-context
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/release-ci.mjs
      - name: Release metadata and full-diff impact
        env:
          IMPACT_BASE: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          METADATA_MODE: ${{ steps.release-context.outputs.metadata_mode }}
          IMPACT_TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          case "$METADATA_MODE" in
            plan) node scripts/sync-release-metadata.mjs --check --plan .release/plan.json ;;
            source-beta) node scripts/sync-release-metadata.mjs --check --source-channel beta ;;
            stable) pnpm run release:metadata:check ;;
            *) exit 1 ;;
          esac
          node scripts/check-release-impact.mjs --base "$IMPACT_BASE" --target-branch "$IMPACT_TARGET_BRANCH"
      - name: Prepare CORA and run JavaScript checks
        env:
          SDK_MODE: ${{ steps.release-context.outputs.sdk_mode }}
        run: |
          node --input-type=module -e "import { assertNpmVersion } from './scripts/npm-release.mjs'; assertNpmVersion();"
          args=()
          case "$SDK_MODE" in
            plan) args=(--plan .release/plan.json) ;;
            consumer) args=(--consumer-plan .release/plan.json) ;;
            source-beta) args=(--source-channel beta) ;;
            stable) ;;
            *) exit 1 ;;
          esac
          pnpm run prepare:cora
          node scripts/build-npm.mjs "${args[@]}"
          pnpm run typecheck
          pnpm test
          node scripts/pack-npm.mjs --destination dist/npm "${args[@]}"
          node scripts/verify-npm.mjs --artifacts dist/npm "${args[@]}"
      - name: Install locked Python quality and test dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv sync --locked --no-install-workspace --python python
      - name: Canonical Python lint and strict boundary types
        run: uv run --frozen --no-sync python scripts/check-python.py
      - name: Python and installer migration checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.venv/Scripts/python.exe -m unittest discover -s test -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Python checks failed' }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/test_installer_migration.ps1
          if ($LASTEXITCODE) { throw 'Installer migration checks failed' }
