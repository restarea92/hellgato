name: Prepare release PR
on:
  push:
    branches: [main, next]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-pr-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'restarea92/hellgato' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.version.outputs.pr-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (Node 24)
      - run: pnpm install --frozen-lockfile
      - name: Check for releasable changesets
        id: pending
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, existsSync } from 'node:fs';
          import { pendingChangesets, ROOT } from './scripts/release-lib.mjs';
          const pending = (await pendingChangesets(ROOT)).some(change => change.releases.length > 0);
          const channel = process.env.GITHUB_REF_NAME === 'next' ? 'beta' : existsSync('.changeset/pre.json') ? 'stable' : '';
          appendFileSync(process.env.GITHUB_OUTPUT, `pending=${pending || channel === 'stable'}\nchannel=${channel}\n`);
          JS
      - id: version
        if: steps.pending.outputs.pending == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: node scripts/release-version.mjs ${{ steps.pending.outputs.channel != '' && format('--channel {0}', steps.pending.outputs.channel) || '' }}
          github-token: ${{ github.token }}
          commit-message: 'chore(release): version selected components'
          pr-title: 'chore(release): publish selected components'
          pr-draft: always
          pr-base-branch: ${{ github.ref_name }}
  checks:
    needs: version
    if: needs.version.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Dispatch checks for this exact bot PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.version.outputs.pr_number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          head=$(jq -er '.head.sha' <<< "$pr")
          branch=$(jq -er '.head.ref' <<< "$pr")
          base=$(jq -er '.base.sha' <<< "$pr")
          base_branch=$(jq -er '.base.ref' <<< "$pr")
          [[ "$base_branch" == main || "$base_branch" == next ]]
          test "$branch" = "changeset-release/$base_branch"
          gh workflow run checks.yml --repo "$GH_REPO" --ref "$branch" -f expected_sha="$head" -f base_sha="$base"
          gh workflow run windows-build.yml --repo "$GH_REPO" --ref "$branch" -f expected_sha="$head"
