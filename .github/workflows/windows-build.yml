name: Windows Rust build
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-sha:
        required: false
        type: string
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      source-sha:
        value: ${{ jobs.build.outputs.source-sha }}
      version:
        value: ${{ jobs.build.outputs.version }}
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      source-sha: ${{ steps.metadata.outputs.source-sha }}
      version: ${{ steps.metadata.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.7'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - id: metadata
        env:
          EXPECTED_SHA: ${{ inputs.source-sha || github.sha }}
        run: |
          $source=git rev-parse HEAD
          if($source -ne $env:EXPECTED_SHA){throw 'Build source changed'}
          "source-sha=$source" >> $env:GITHUB_OUTPUT
          $version=(Get-Content packages/windows-release/package.json -Raw|ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Prepare build tools and reviewed inputs
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.98.1 --profile minimal
          if($LASTEXITCODE){throw 'Rust installation failed'}
          rustup default 1.98.1
          pnpm install --frozen-lockfile
          if($LASTEXITCODE){throw 'Dependency installation failed'}
          npm install --prefix work/tooling npm@11.9.0 --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE){throw 'Pinned npm installation failed'}
          (Join-Path $pwd 'work/tooling/node_modules/.bin') >> $env:GITHUB_PATH
          python -m pip install pefile==2024.8.26
          python scripts/prepare-windows.py
          if($LASTEXITCODE){throw 'Reviewed inputs failed'}
          python host-integrations/streamdeck/windows/native/ui/prepare.py
          if($LASTEXITCODE){throw 'Qt build inputs failed'}
          $setup=Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'){throw 'Inno Setup checksum mismatch'}
          Start-Process $setup -ArgumentList '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="'+$env:RUNNER_TEMP+'/InnoSetup"') -WindowStyle Hidden -Wait
      - name: Build native components and reference layout
        run: |
          python host-integrations/streamdeck/windows/native/ui/build.py --output work/build-native-ui-package
          if($LASTEXITCODE){throw 'Native UI build failed'}
          python host-integrations/streamdeck/windows/native/startup/build.py
          if($LASTEXITCODE){throw 'Startup support build failed'}
          $msi=Join-Path $env:RUNNER_TEMP 'StreamDeck.msi'
          Invoke-WebRequest 'https://edge.elgato.com/egc/windows/sd/Stream_Deck_7.6.0.23012.msi' -OutFile $msi
          if((Get-AuthenticodeSignature -LiteralPath $msi).Status -ne 'Valid'){throw 'Reference installer signature is invalid'}
          $reference=Join-Path $pwd 'work/streamdeck-reference'
          $extract=Start-Process msiexec.exe -ArgumentList '/a',('"'+$msi+'"'),'/qn',('TARGETDIR="'+$reference+'"') -WindowStyle Hidden -PassThru -Wait
          if($extract.ExitCode -ne 0){throw 'Reference extraction failed'}
          $executables=@(Get-ChildItem -LiteralPath $reference -Recurse -Filter StreamDeck.exe)
          if($executables.Count -ne 1 -or (Get-FileHash $executables[0].FullName -Algorithm SHA256).Hash -ne '2963DF27B13F97E5736E3F931348D89D2F693109F3CB9DC3C9899300E35EA9E3'){throw 'Reference executable changed'}
          $env:PYTHONPATH=Join-Path $pwd 'host-integrations/streamdeck/windows/python'
          python -c 'from hellgato_host.startup_install import install;import sys;install(sys.argv[1],sys.argv[2])' $executables[0].FullName (Join-Path $pwd 'work/build-native-startup/version.dll')
          if($LASTEXITCODE){throw 'Reference layout preparation failed'}
          $executables[0].DirectoryName | Set-Content work/startup-reference-path.txt
      - name: Build Node and Rust application
        run: |
          pnpm run prepare:cora
          if($LASTEXITCODE){throw 'CORA preparation failed'}
          pnpm run build:npm
          if($LASTEXITCODE){throw 'SDK build failed'}
          node scripts/stage-windows-sdk.mjs
          if($LASTEXITCODE){throw 'SDK staging failed'}
          foreach($crate in @('adapters/mirabox-rust','host-integrations/streamdeck/windows/rust','apps/stream-dog/rust')){
            cargo build --release --locked --manifest-path "$crate/Cargo.toml"
            if($LASTEXITCODE){throw "Rust build failed: $crate"}
          }
          node scripts/stream-dog/stage.mjs --destination work/rust-release --startup-directory (Get-Content work/startup-reference-path.txt)
          if($LASTEXITCODE){throw 'Runtime staging failed'}
          ./scripts/stream-dog/build-installer.ps1 -Bundle work/rust-release -Iscc (Join-Path $env:RUNNER_TEMP 'InnoSetup/ISCC.exe') -Version '${{ steps.metadata.outputs.version }}'
          if($LASTEXITCODE){throw 'Installer build failed'}
          @{schemaVersion=1;kind='hellgato-stream-dog-rust';sourceSha='${{ steps.metadata.outputs.source-sha }}';version='${{ steps.metadata.outputs.version }}';pythonRuntime=$false}|ConvertTo-Json|Set-Content dist/build-manifest.json
      - id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/Hellgato-${{ steps.metadata.outputs.version }}-Setup.exe
            dist/Hellgato-${{ steps.metadata.outputs.version }}-Setup.exe.sha256
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14
