name: Windows build

on:
  push:
    branches: [main]
    paths: ['app/**', 'apps/**', 'adapters/**', 'host-integrations/**', 'vendor/**', 'schemas/**', 'tests/**', 'native/**', 'installer/**', 'scripts/**', 'test/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'pyproject.toml', 'uv.lock', '.release/**', 'docs/releases/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['app/**', 'apps/**', 'adapters/**', 'host-integrations/**', 'vendor/**', 'schemas/**', 'tests/**', 'native/**', 'installer/**', 'scripts/**', 'test/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'pyproject.toml', 'uv.lock', '.release/**', 'docs/releases/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact head for dispatched PR checks
        required: false
        type: string
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      run_id:
        value: ${{ jobs.build.outputs.run_id }}
      run_attempt:
        value: ${{ jobs.build.outputs.run_attempt }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      run_id: ${{ steps.identity.outputs.run_id }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.7'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (Node 24)
      - name: Validate exact checkout and locked metadata
        id: identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || inputs.release_sha }}
        run: |
          if ($env:EXPECTED_SHA -and (git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Unexpected checkout SHA' }
          npm install --global npm@11.9.0 --ignore-scripts
          if ($LASTEXITCODE) { throw 'Pinned npm installation failed' }
          npm prefix --global >> $env:GITHUB_PATH
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Frozen workspace installation failed' }
          pnpm run release:metadata:check
          if ($LASTEXITCODE) { throw 'Release metadata drift' }
          "run_id=$env:GITHUB_RUN_ID" >> $env:GITHUB_OUTPUT
          "run_attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - name: Resolve installer version
        id: metadata
        run: |
          $version = python scripts/windows_release.py version
          if ($LASTEXITCODE) { throw 'Invalid Windows installer version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: |
          python -m pip install -r installer/requirements-build.txt
          if ($LASTEXITCODE) { throw 'Python build dependency installation failed' }
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process $setup -ArgumentList '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=`"$compiler`"" -WindowStyle Hidden -Wait
      - name: Test and build
        run: |
          python -m unittest discover -s test -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Python checks failed' }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/test_installer_migration.ps1
          if ($LASTEXITCODE) { throw 'Installer migration checks failed' }
          ./scripts/build-windows.ps1 -Iscc (Join-Path $env:RUNNER_TEMP 'InnoSetup/ISCC.exe')
          if ($LASTEXITCODE) { throw 'Windows build failed' }
          $expectedVersion = python scripts/windows_release.py version
          if ($LASTEXITCODE) { throw 'Expected packaged version unavailable' }
          $packagedVersion = & ./dist/Hellgato/HellgatoWorker.exe --version
          if ($LASTEXITCODE -or $packagedVersion -ne $expectedVersion) { throw 'Packaged runtime version differs from installer metadata' }
          ./work/build-runtime/node.exe --test test/*.test.mjs
          if ($LASTEXITCODE) { throw 'CORA checks failed' }
          python scripts/windows_release.py artifacts
          if ($LASTEXITCODE) { throw 'Installer artifact validation failed' }
      - name: Save isolated native fixture results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          archive: true
          overwrite: false
          name: native-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/build-native-startup/fixture/fixture-results.json
            work/build-native-ui-test/fixture-results.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Bind artifacts to their exact build
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          python scripts/windows_release.py manifest
          if ($LASTEXITCODE) { throw 'Build manifest failed' }
      - name: Save installer and SHA-256 (not a release)
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          archive: true
          overwrite: false
          name: windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/Hellgato-${{ steps.metadata.outputs.version }}-Setup.exe
            dist/Hellgato-${{ steps.metadata.outputs.version }}-Setup.exe.sha256
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Download this exact artifact for a read-only round trip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          skip-decompress: false
          digest-mismatch: error
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/hellgato-artifact-roundtrip
          merge-multiple: true
      - name: Verify round-trip artifact members and bytes
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/hellgato-artifact-roundtrip
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('dist')
          downloaded = Path(os.environ['ARTIFACT_DIRECTORY'])
          manifest = json.loads((source / 'build-manifest.json').read_text())
          expected = {'build-manifest.json', *(entry['name'] for entry in manifest['files'])}
          if {path.name for path in downloaded.iterdir()} != expected:
              raise SystemExit('Round-trip artifact member mismatch')
          for name in expected:
              if (downloaded / name).read_bytes() != (source / name).read_bytes():
                  raise SystemExit(f'Round-trip artifact byte mismatch: {name}')
          print('Exact uploaded artifact ID, ZIP extraction, members and bytes verified')
          PY
