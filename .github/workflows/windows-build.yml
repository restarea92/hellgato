name: Windows build

on:
  push:
    branches: [main]
    paths: ['app/**', 'apps/**', 'adapters/**', 'host-integrations/**', 'vendor/**', 'schemas/**', 'native/**', 'installer/**', 'scripts/**', 'test/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'pyproject.toml', 'uv.lock', 'docs/releases/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['app/**', 'apps/**', 'adapters/**', 'host-integrations/**', 'vendor/**', 'schemas/**', 'native/**', 'installer/**', 'scripts/**', 'test/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'pyproject.toml', 'uv.lock', 'docs/releases/**', '.github/workflows/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.7'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Resolve installer version
        id: metadata
        run: |
          $version = python scripts/windows_release.py version
          if ($LASTEXITCODE) { throw 'Invalid Windows installer version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Workspace dependency installation failed' }
          npm install --prefix work/tooling npm@11.9.0 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Pinned npm installation failed' }
          (Join-Path $pwd 'work/tooling/node_modules/.bin') >> $env:GITHUB_PATH
          python -m pip install --disable-pip-version-check uv==0.12.23
          if ($LASTEXITCODE) { throw 'Pinned uv installation failed' }
          uv sync --locked --no-install-workspace --python python
          if ($LASTEXITCODE) { throw 'Locked Python build environment failed' }
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process $setup -ArgumentList '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=`"$compiler`"" -WindowStyle Hidden -Wait
      - name: Test and build
        run: |
          pnpm run prepare:cora
          if ($LASTEXITCODE) { throw 'CORA preparation failed' }
          pnpm run build:npm
          if ($LASTEXITCODE) { throw 'SDK package build failed' }
          & ./.venv/Scripts/python.exe -m unittest discover -s test -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Python checks failed' }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/test_installer_migration.ps1
          if ($LASTEXITCODE) { throw 'Installer migration checks failed' }
          ./scripts/build-windows.ps1 -Python (Join-Path $pwd '.venv/Scripts/python.exe') -Iscc (Join-Path $env:RUNNER_TEMP 'InnoSetup/ISCC.exe')
          if ($LASTEXITCODE) { throw 'Windows build failed' }
          $applicationTests = @(Get-ChildItem test -Filter '*.test.mjs' | Where-Object { $_.Name -notlike 'release-*.test.mjs' } | ForEach-Object { $_.FullName })
          ./work/build-runtime/node.exe --test @applicationTests
          if ($LASTEXITCODE) { throw 'Application checks failed' }
          python scripts/windows_release.py artifacts
          if ($LASTEXITCODE) { throw 'Installer artifact validation failed' }
      - name: Save installer and SHA-256 (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/Hellgato-${{ steps.metadata.outputs.version }}-Setup.exe
            dist/Hellgato-${{ steps.metadata.outputs.version }}-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
