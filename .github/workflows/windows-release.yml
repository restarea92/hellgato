name: Windows Rust beta draft
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-draft-release
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/windows-build.yml
    with:
      source-sha: ${{ inputs.source_sha }}
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Create a beta draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cd dist
          sha256sum -c "Hellgato-$VERSION-Setup.exe.sha256"
          cd ..
          gh release create "v$VERSION" "dist/Hellgato-$VERSION-Setup.exe" "dist/Hellgato-$VERSION-Setup.exe.sha256" dist/build-manifest.json --target "$SOURCE_SHA" --title "Hellgato Stream Dog $VERSION Beta" --notes-file "docs/releases/$VERSION.md" --draft --prerelease
