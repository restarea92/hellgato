name: Windows release

# Publication is never triggered by a code push, PR, tag push or release event.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag at this main commit (vMAJOR.MINOR.PATCH)'
        required: true
        type: string
      confirm:
        description: 'Publish this explicitly prepared new stable version'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serialize all stable publications, including retries and different versions.
concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'restarea92/hellgato' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - name: Validate release request without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: python scripts/windows_release.py check

  build:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/windows-build.yml

  publish:
    needs: [preflight, build]
    if: github.repository == 'restarea92/hellgato' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Revalidate and publish the exact tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: python scripts/windows_release.py publish
