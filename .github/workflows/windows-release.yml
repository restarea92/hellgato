name: Windows release recovery
# This compatibility entry point delegates to the single serialized publisher.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact previously approved release merge SHA
        required: true
        type: string
      source_run_id:
        description: Original verified release build run ID
        required: true
        type: string
      source_run_attempt:
        description: Original verified build attempt
        required: true
        type: string
      windows_artifact_id:
        description: Original immutable Windows artifact ID
        required: true
        type: string
      confirm:
        description: Resume this previously approved Windows-only release
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dispatch:
    if: github.repository == 'restarea92/hellgato' && github.ref == 'refs/heads/main' && inputs.confirm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the common release recovery entry point
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          WINDOWS_ARTIFACT_ID: ${{ inputs.windows_artifact_id }}
        run: |
          gh workflow run release.yml --repo "$GH_REPO" --ref main \
            -f release_sha="$RELEASE_SHA" -f source_run_id="$SOURCE_RUN_ID" \
            -f source_run_attempt="$SOURCE_RUN_ATTEMPT" -f windows_artifact_id="$WINDOWS_ARTIFACT_ID" \
            -f confirm=true
