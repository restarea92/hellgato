name: Interface wording
description: Suggest a correction to text in the current interface.
title: "Translation: "
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Korean (current Windows app)
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Include the app version and where this message appears.
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested translation
      description: Preserve product names and placeholders such as "{count}".
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the wording or describe where it appears in the app.
