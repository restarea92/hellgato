[package]
name = "hellgato-stream-dog"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
rfd = { version = "=0.17.2", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
hellgato-windows-host = { path = "../../../host-integrations/streamdeck/windows/rust" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
